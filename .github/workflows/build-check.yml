name: Build check

# main 이 아닌 브랜치와 PR 에서 Quartz 빌드만 돌린다. 배포는 하지 않는다.
#
# deploy.yml 은 push:main / workflow_dispatch 로만 돌고 곧바로 Pages 에 배포하므로
# 검증용으로 쓸 수 없다. 이 워크플로는 deploy.yml 의 build job 을 그대로 복제하되
# pages 권한과 upload-pages-artifact / deploy-pages 단계를 뺐다.

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 배포에 필요한 pages: write / id-token: write 를 주지 않는다.
permissions:
  contents: read

concurrency:
  # deploy.yml 의 'pages' 그룹과 겹치지 않게 분리한다.
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: node quartz/bootstrap-cli.mjs plugin install --from-config

      - name: Patch search tokenizer
        run: npm run patch-search

      - name: Normalize Obsidian frontmatter
        run: npm run normalize-frontmatter

      # GEMINI_API_KEY 없이도 heuristic scoring 으로 degrade 한다(scripts/build-related-notes.mjs).
      # 검증 목적이므로 secret 을 주지 않는다.
      - name: Build related notes
        run: npm run build-related-notes

      - name: Build Quartz
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node quartz/bootstrap-cli.mjs build --concurrency=2

      # 빌드가 통과했다는 것만으로는 CSS 가 의도대로 나왔는지 알 수 없다.
      # custom.scss 가 참조하는 로컬 에셋이 실제로 public/ 에 있는지 확인한다.
      # 폰트 경로 오타는 빌드를 깨지 않고 조용히 폴백되기 때문이다.
      - name: Verify local assets referenced by custom.scss
        run: |
          missing=0
          refs=$(grep -oE '/static/[A-Za-z0-9._/-]+\.(woff2|woff|ttf|otf)' quartz/styles/custom.scss | sort -u)
          if [ -z "$refs" ]; then
            echo "custom.scss 에서 참조하는 로컬 폰트 없음 — 건너뜀"
            exit 0
          fi
          for ref in $refs; do
            if [ -f "public$ref" ]; then
              printf 'ok       public%s (%s bytes)\n' "$ref" "$(stat -c%s "public$ref")"
            else
              printf 'MISSING  public%s\n' "$ref"
              missing=1
            fi
          done
          exit $missing

      - name: Verify custom.scss compiled into the emitted stylesheet
        run: |
          css=$(find public -maxdepth 1 -name '*.css' | head -1)
          if [ -z "$css" ]; then
            echo "public/ 에 스타일시트가 없다"
            exit 1
          fi
          echo "검사 대상: $css ($(stat -c%s "$css") bytes)"
          # custom.scss 의 @font-face family 이름들이 컴파일 결과에 살아있는지 본다.
          fams=$(grep -oE 'font-family:\s*"[^"]+"' quartz/styles/custom.scss | grep -oE '"[^"]+"' | tr -d '"' | sort -u)
          missing=0
          for f in $fams; do
            if grep -qF "$f" "$css"; then
              printf 'ok       %s\n' "$f"
            else
              printf 'MISSING  %s (custom.scss 에는 있지만 컴파일 결과에 없다)\n' "$f"
              missing=1
            fi
          done
          exit $missing

      - name: Summary
        run: |
          {
            echo "### Build check 통과"
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 페이지 | $(find public -name '*.html' | wc -l) |"
            echo "| public/ 크기 | $(du -sh public | cut -f1) |"
            echo "| 폰트 | $(find public/static/fonts -type f 2>/dev/null | wc -l) 개 |"
            echo
            echo "배포는 하지 않았다. main 에 머지하면 \`deploy.yml\` 이 배포한다."
          } >> "$GITHUB_STEP_SUMMARY"
