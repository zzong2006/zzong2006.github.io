name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 폴더로는 막을 수 없는 유출을 잡는 최후 방어선. 패턴 목록 자체가 사내
      # 정보라 저장소에 두지 않고 secret 으로 주입한다.
      - name: Check for internal information in content
        env:
          PRIVATE_PATTERNS_JSON: ${{ secrets.PRIVATE_PATTERNS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_PATTERNS_JSON:-}" ]; then
            echo "::error::PRIVATE_PATTERNS_JSON secret 이 비어 있다."
            echo "::error::검사를 건너뛰지 않고 실패로 처리한다. 게이트가 조용히 사라지면 의미가 없다."
            exit 1
          fi
          printf '%s' "$PRIVATE_PATTERNS_JSON" > "${RUNNER_TEMP}/private-patterns.json"
          PRIVATE_PATTERNS_FILE="${RUNNER_TEMP}/private-patterns.json"             python3 scripts/check_private_leak.py

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: node quartz/bootstrap-cli.mjs plugin install --from-config

      - name: Patch search tokenizer
        run: npm run patch-search

      - name: Normalize Obsidian frontmatter
        run: npm run normalize-frontmatter

      - name: Build related notes
        run: npm run build-related-notes

      - name: Build Quartz
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node quartz/bootstrap-cli.mjs build --concurrency=2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 사이트가 커져(아티팩트 46MB, 1600+ 페이지) 기본 10분 타임아웃 안에
          # Pages 측 updating_pages 가 끝나지 않아 배포가 취소되는 일이 있었다.
          timeout: 1800000
          error_count: 20
